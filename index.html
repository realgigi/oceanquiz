<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白貓博士的海洋復育行動 - 益智問答遊戲</title>
    <link rel="stylesheet" href="style.css">

    <!-- 早期預載：HTML 一拿到就開始抓題庫和必載影片，與 JS 平行 -->
    <link rel="preload" href="questions.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="assets/video/開頭影片.mp4" as="fetch" type="video/mp4" crossorigin="anonymous">
    <link rel="preload" href="assets/video/十秒背景.mp4" as="fetch" type="video/mp4" crossorigin="anonymous">
    <link rel="preload" href="assets/video/title-bg.webp" as="image">
    <link rel="preload" href="assets/video/start-button.webp" as="image">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QWZV3TW3N8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QWZV3TW3N8');
    </script>
    <!-- Firebase Firestore (排行榜) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import { getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs, serverTimestamp }
        from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCEfNgMkfGPlP7usycF_wrNFzBM_X2h9JY",
        authDomain: "oceanquiz-lb.firebaseapp.com",
        projectId: "oceanquiz-lb",
        storageBucket: "oceanquiz-lb.firebasestorage.app",
        messagingSenderId: "973490053267",
        appId: "1:973490053267:web:94109b9e4071fefd3e6d66",
        measurementId: "G-WSVL36CYWC"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.LeaderboardAPI = {
        async submit({ name, category, score, correct, total }) {
          return addDoc(collection(db, 'scores'), {
            name: String(name).slice(0, 8),
            category,
            score: Number(score),
            correct: Number(correct),
            total: Number(total),
            timestamp: serverTimestamp(),
          });
        },
        async fetchTop(category, n = 10) {
          const q = query(
            collection(db, 'scores'),
            where('category', '==', category),
            orderBy('score', 'desc'),
            limit(n)
          );
          const snap = await getDocs(q);
          return snap.docs.map(d => {
            const x = d.data();
            return {
              id: d.id,
              name: x.name,
              score: x.score,
              correct: x.correct,
              total: x.total,
              date: x.timestamp ? x.timestamp.toDate() : null,
            };
          });
        }
      };
      window.dispatchEvent(new Event('leaderboard-ready'));
    </script>
</head>
<body>
    <div id="game-viewport">
        <!-- Video layer: dual video for crossfade -->
        <div id="video-layer">
            <video id="bg-video-a" muted playsinline></video>
            <video id="bg-video-b" muted playsinline style="opacity:0"></video>
        </div>

        <!-- UI layer -->
        <div id="ui-layer">
            <!-- Loading screen -->
            <div id="loading-screen" class="screen active">
                <div class="loading-title">🐱 白貓博士的海洋復育行動</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="loading-text" id="loading-text">載入中...</div>
            </div>

            <!-- Title screen -->
            <div id="title-screen" class="screen">
                <img id="title-bg-image" src="" alt="">
                <button id="start-btn" aria-label="開始遊戲">開始遊戲</button>
                <button id="title-leaderboard-btn" aria-label="查看排行榜">🏆 排行榜</button>
                <div class="title-footer">
                    <div class="title-version">v2.0 (20260526)</div>
                    <div class="title-disclaimer">資訊可能有誤，請協助回報</div>
                </div>
            </div>

            <!-- Category selection screen -->
            <div id="category-screen" class="screen">
                <div class="category-title">選擇題庫</div>
                <div class="category-subtitle">每次隨機抽選 10 題大考驗！</div>
                <div class="category-list">
                    <button class="category-btn" data-cat="restoration">
                        <span class="cat-icon">🐠</span>
                        <span class="cat-name">資源復育</span>
                        <span class="cat-count" id="count-restoration">0 題</span>
                    </button>
                    <button class="category-btn" data-cat="ecology">
                        <span class="cat-icon">🌊</span>
                        <span class="cat-name">海洋生態</span>
                        <span class="cat-count" id="count-ecology">0 題</span>
                    </button>
                    <button class="category-btn" data-cat="aquaculture">
                        <span class="cat-icon">🦐</span>
                        <span class="cat-name">水產養殖</span>
                        <span class="cat-count" id="count-aquaculture">0 題</span>
                    </button>
                    <button class="category-btn" data-cat="course">
                        <span class="cat-icon">📘</span>
                        <span class="cat-name">海洋教育課程</span>
                        <span class="cat-count" id="count-course">0 題</span>
                    </button>
                    <button class="category-btn category-btn-all" data-cat="all">
                        <span class="cat-icon">🌏</span>
                        <span class="cat-name">全部題目</span>
                        <span class="cat-count" id="count-all">0 題</span>
                    </button>
                </div>
            </div>

            <!-- Quiz screen -->
            <div id="quiz-screen" class="screen">
                <div class="top-bar">
                    <div id="score-box" class="info-box">
                        <span class="info-box-text" id="score-text">0</span>
                    </div>
                    <div id="timer-box" class="info-box">
                        <span class="info-box-text" id="timer-text">10</span>
                    </div>
                </div>
                <div id="question-box">
                    <span id="question-text"></span>
                </div>
                <button id="answer-0" class="answer-btn" data-idx="0">
                    <span class="answer-text"></span>
                </button>
                <button id="answer-1" class="answer-btn" data-idx="1">
                    <span class="answer-text"></span>
                </button>
                <button id="answer-2" class="answer-btn" data-idx="2">
                    <span class="answer-text"></span>
                </button>
                <button id="answer-3" class="answer-btn" data-idx="3">
                    <span class="answer-text"></span>
                </button>
            </div>

            <!-- Explanation overlay -->
            <div id="explanation-overlay" class="screen">
                <div id="explanation-frame">
                    <div id="explanation-result"></div>
                    <div id="explanation-text"></div>
                    <div id="explanation-funfact"></div>
                    <div id="explanation-continue">點擊繼續</div>
                </div>
            </div>

            <!-- End screen -->
            <div id="end-screen" class="screen">
                <div class="end-title">遊戲結束</div>
                <div class="end-rank" id="end-rank"></div>
                <div class="end-score" id="end-score"></div>
                <div class="end-detail" id="end-detail"></div>
                <div class="end-buttons">
                    <button id="submit-score-btn" class="primary-btn">🏆 上傳到排行榜</button>
                    <button id="view-leaderboard-btn" class="secondary-btn">看排行榜</button>
                    <button id="restart-btn" class="secondary-btn">再玩一次</button>
                </div>
            </div>

            <!-- Name input overlay -->
            <div id="name-input-screen" class="screen">
                <div class="name-input-frame">
                    <div class="name-input-title">輸入你的名字</div>
                    <div class="name-input-subtitle" id="name-input-subtitle"></div>
                    <input id="player-name" type="text" maxlength="8" placeholder="最多 8 字" autocomplete="off">
                    <div class="name-input-hint" id="name-input-hint">分數會上傳到排行榜</div>
                    <div class="name-input-buttons">
                        <button id="name-submit-btn" class="primary-btn">提交</button>
                        <button id="name-skip-btn" class="secondary-btn">略過</button>
                    </div>
                </div>
            </div>

            <!-- Leaderboard screen -->
            <div id="leaderboard-screen" class="screen">
                <div class="leaderboard-frame">
                    <div class="leaderboard-title">🏆 排行榜 Top 10</div>
                    <div class="leaderboard-tabs">
                        <button class="lb-tab" data-cat="restoration">復育</button>
                        <button class="lb-tab" data-cat="ecology">生態</button>
                        <button class="lb-tab" data-cat="aquaculture">養殖</button>
                        <button class="lb-tab" data-cat="course">課程</button>
                        <button class="lb-tab" data-cat="all">全部</button>
                    </div>
                    <div class="leaderboard-list" id="lb-list">
                        <div class="lb-loading">載入中…</div>
                    </div>
                    <button id="lb-back-btn" class="primary-btn">返回</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
